<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contact Royal Dream APK support team for feedback, issue reports, and user assistance."
    />
    <title>Contact Royal Dream APK</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="section">
      <div class="container">
        <h1 class="section-title reveal">Contact Us</h1>
        <p class="section-text reveal">Need support, want to report a bug, or have a business inquiry? Reach out anytime.</p>

        <div class="grid-2" style="margin-top: 1rem">
          <article class="card reveal">
            <h2>Send a Message</h2>
            <!-- Beginner-friendly contact form (front-end demo only) -->
            <form id="contact-form">
              <input type="text" name="name" placeholder="Your Name" required />
              <input type="email" name="email" placeholder="Your Email" required />
              <textarea name="message" placeholder="Write your message here..." required></textarea>
              <button class="btn btn-primary" type="submit">Submit Message</button>
            </form>
          </article>

          <article class="card reveal">
            <h2>Email Support</h2>
            <p class="small-text">support@royaldreamapk.example</p>
            <h3 style="margin-top: 1rem">Social Media</h3>
            <div class="socials" style="margin-top: 0.8rem">
              <a href="#" aria-label="Facebook">f</a>
              <a href="#" aria-label="Telegram">t</a>
              <a href="#" aria-label="YouTube">y</a>
              <a href="#" aria-label="Discord">d</a>
            </div>
            <h3 style="margin-top: 1rem">Support Hours</h3>
            <p class="small-text">Monday - Saturday: 9:00 AM to 8:00 PM (UTC)</p>
          </article>
        </div>
      </div>
    </main>
    <div id="footer"></div>
    <script src="assets/js/main.js"></script>
  </body>
</html>
